<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
:root{
  --bg:#0a0d12;--panel:#161b24;--border:#232a36;--text:#e6edf3;
  --muted:#8b949e;--accent:#58a6ff;--purple:#a371f7;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:36px 32px;max-width:420px;width:100%;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.logo{width:52px;height:52px;border-radius:12px;margin:0 auto 20px;
  background:linear-gradient(135deg,var(--accent),var(--purple));
  display:flex;align-items:center;justify-content:center;font-weight:700;
  font-size:20px;color:#fff}
h1{margin:0 0 8px;font-size:20px;font-weight:600;letter-spacing:-0.01em}
.sub{color:var(--muted);font-size:13px;margin-bottom:24px}
button{background:linear-gradient(135deg,var(--accent),#4a90e2);color:#fff;
  border:none;padding:12px 24px;border-radius:8px;font-size:14px;
  font-weight:600;cursor:pointer;font-family:inherit;width:100%;
  transition:transform 0.1s ease}
button:hover{transform:translateY(-1px)}
.who{margin-top:20px;padding-top:20px;border-top:1px solid var(--border);
  font-size:12px;color:var(--muted)}
.who strong{color:var(--text);font-weight:600}
.redirect{margin-top:16px;color:var(--accent);font-size:12px}
</style>
</head>
<body>

<div class="center">
  <div class="card">
    <div class="logo" id="logo">··</div>
    <h1 id="title">Project Tracker</h1>
    <div class="sub" id="sub">Sign in to view your dashboard</div>
    <button id="loginBtn" onclick="openLogin()">Sign in</button>
    <div class="who" id="who" style="display:none;"></div>
    <div class="redirect" id="redirect" style="display:none;"></div>
  </div>
</div>

<script>
let currentUser = null;

function openLogin() {
  if (window.netlifyIdentity) {
    window.netlifyIdentity.open();
  }
}

function getRoles(user) {
  if (!user) return [];
  const appRoles = (user.app_metadata && user.app_metadata.roles) || [];
  const userRoles = (user.user_metadata && user.user_metadata.roles) || [];
  return appRoles.concat(userRoles);
}

function routeByRole(user) {
  const roles = getRoles(user);

  const audienceMap = {
    executive: "/executive/",
    tomato_farms: "/tomato_farms/"
  };

  for (const r of roles) {
    if (audienceMap[r]) {
      document.getElementById("redirect").style.display = "block";
      document.getElementById("redirect").textContent = "Redirecting to your dashboard...";
      setTimeout(() => {
        window.location.href = audienceMap[r];
      }, 400);
      return;
    }
  }

  document.getElementById("redirect").style.display = "block";
  document.getElementById("redirect").textContent =
    "No dashboard assigned to your account. Contact the administrator.";
}

function renderUser(user) {
  const btn = document.getElementById("loginBtn");
  const who = document.getElementById("who");

  if (!user) {
    btn.style.display = "block";
    btn.textContent = "Sign in";
    who.style.display = "none";
    document.getElementById("redirect").style.display = "none";
    return;
  }

  currentUser = user;
  const name = user.user_metadata && user.user_metadata.full_name
    ? user.user_metadata.full_name
    : user.email;
  const roles = getRoles(user);

  btn.textContent = "Log out";
  btn.onclick = () => {
    window.netlifyIdentity.logout();
  };

  who.style.display = "block";
  who.innerHTML = "Signed in as <strong>" + name + "</strong><br>Role: " +
    (roles.length ? roles.join(", ") : "none");

  routeByRole(user);
}

window.addEventListener("load", () => {
  if (!window.netlifyIdentity) {
    document.getElementById("sub").textContent = "Netlify Identity not loaded";
    return;
  }

  window.netlifyIdentity.on("init", user => renderUser(user));
  window.netlifyIdentity.on("login", user => {
    window.netlifyIdentity.close();
    renderUser(user);
  });
  window.netlifyIdentity.on("logout", () => {
    currentUser = null;
    renderUser(null);
  });

  window.netlifyIdentity.init();
});
</script>
</body>
</html>
